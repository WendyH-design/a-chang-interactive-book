<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>《怪咖機器人阿鏘》AR 彩蛋 - 阿鏘誕生</title>

  <!-- Local A-Frame & MindAR Libraries (Offline & Self-Contained) -->
  <script src="./assets/libs/aframe.min.js"></script>
  <script src="./assets/libs/mindar-image.prod.js"></script>
  <script src="./assets/libs/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- AR 3D Scene Layer -->
  <div id="ar-container">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets/achang.mind; autoStart: false; filterMinCF: 0.0005; filterBeta: 1000; missTolerance: 5; warmupTolerance: 3; uiLoading: no; uiScanning: no; uiError: no"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
        <!-- 1. Electric Sparks Plane (Appears at wire junction: 0.0s - 0.8s) -->
        <a-image
          id="ar-sparkle"
          src="./assets/images/sparkle.png"
          position="0.04 -0.07 0.02"
          width="0.22"
          height="0.22"
          visible="false">
        </a-image>

        <!-- 2. Pre-leap Chest Gauge Glow on Book Illustration (0.8s - 1.8s) -->
        <a-image
          id="ar-book-glow"
          src="./assets/images/gauge_glow_enhanced.png"
          position="0.195 -0.043 0.025"
          width="0.13"
          height="0.13"
          visible="false">
        </a-image>

        <!-- 3. Pre-leap Antenna Wobble on Book Illustration (1.4s - 1.8s) -->
        <a-entity id="ar-book-antenna-pivot" position="0.185 0.076 0.025" visible="false">
          <a-image
            id="ar-book-antenna"
            src="./assets/images/achang_antenna.png"
            width="0.101"
            height="0.063"
            position="0.0283 0.0283 0">
          </a-image>
        </a-entity>

        <!-- 4. Achang Main Entity (Leaps from z: 0.01 to z: 0.08 at 1.8s) -->
        <a-entity id="ar-achang" position="0.22 -0.03 0.01" visible="false">
          <!-- 4a. Achang Body (without antenna) -->
          <a-image
            id="ar-achang-body"
            src="./assets/images/achang_body.png"
            position="0 0 0"
            width="0.38"
            height="0.351">
          </a-image>

          <!-- 4b. Independent Antenna with Pivot at base collar -->
          <a-entity id="ar-antenna-pivot" position="-0.0093 0.1193 0.005">
            <a-image
              id="ar-achang-antenna"
              src="./assets/images/achang_antenna.png"
              position="0.0283 0.0283 0"
              width="0.101"
              height="0.063">
            </a-image>
          </a-entity>

          <!-- 4c. Chest Gauge Golden Glow (Clearly in front of body at z: +0.015) -->
          <a-image
            id="ar-glow"
            src="./assets/images/gauge_glow_enhanced.png"
            position="0.0194 -0.0324 0.015"
            width="0.14"
            height="0.14"
            visible="false">
          </a-image>
        </a-entity>

        <!-- 5. Popcorn Burst Multi-Particle Group (4.2s - 5.6s, in foreground Z = 0.12) -->
        <a-entity id="ar-popcorn-group" position="0.22 0.06 0.12" visible="false">
          <a-image id="popcorn-p1" src="./assets/images/popcorn_1.png" width="0.12" height="0.12" position="0 0 0"></a-image>
          <a-image id="popcorn-p2" src="./assets/images/popcorn_2.png" width="0.09" height="0.084" position="0 0 0"></a-image>
          <a-image id="popcorn-p3" src="./assets/images/popcorn_3.png" width="0.09" height="0.08" position="0 0 0"></a-image>
          <a-image id="popcorn-p4" src="./assets/images/popcorn_4.png" width="0.08" height="0.08" position="0 0 0"></a-image>
          <a-image id="popcorn-p5" src="./assets/images/popcorn_5.png" width="0.08" height="0.08" position="0 0 0"></a-image>
        </a-entity>

        <!-- 6. Dialogue Bubble: 「你好呀！我就是阿鏘！」 (2.6s+, in foreground Z = 0.14) -->
        <a-image
          id="ar-bubble"
          src="./assets/images/bubble.png"
          position="0.24 0.23 0.14"
          width="0.34"
          height="0.17"
          visible="false">
        </a-image>
      </a-entity>
    </a-scene>
  </div>

  <!-- UI Overlay Layer -->
  <div id="ui-layer">
    <!-- Top Navigation Bar -->
    <header id="top-bar">
      <button id="btn-back" class="nav-btn" aria-label="返回繪本" title="返回繪本">
        <span class="icon">📖</span>
        <span class="text">返回繪本</span>
      </button>

      <div class="top-controls">
        <button id="btn-preview-toggle" class="control-btn" aria-label="查看辨識圖片" title="查看辨識圖片">
          <span>🖼️ 辨識圖</span>
        </button>
        <button id="btn-audio-toggle" class="control-btn" aria-label="音效開關（目前為開啟）" title="開啟／關閉音效" type="button" aria-pressed="false">
          <span id="audio-icon">🔊</span>
        </button>
      </div>
    </header>

    <!-- Scanning Reticle / Viewfinder Frame -->
    <div id="scanning-viewfinder" class="active">
      <div class="viewfinder-box">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-laser"></div>
      </div>
      <p class="scan-hint">請將鏡頭對準故事頁數 4/11<br><strong>「小宇接電線・阿鏘誕生」</strong>插畫</p>
    </div>

    <!-- Live Status Pill (Bottom) -->
    <div id="status-pill" class="searching">
      <span class="status-dot"></span>
      <span id="status-text">正在尋找阿鏘...</span>
    </div>

    <!-- Replay Floating Button -->
    <button id="btn-replay" class="replay-btn hidden" aria-label="再看一次">
      <span class="replay-icon">🔄</span>
      <span>再看一次阿鏘誕生！</span>
    </button>
  </div>

  <!-- Modal 1: Welcome & Audio/Camera Permission Overlay -->
  <div id="modal-welcome" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-badge">✨ AR 彩蛋體驗 ✨</div>
      <h1 class="modal-title">怪咖機器人阿鏘<br>即將跳出繪本！</h1>
      <p class="modal-desc">
        拿起手機鏡頭，對準故事頁數 4/11「小宇接電線」插畫，<br>
        一起見證阿鏘的誕生奇蹟！
      </p>

      <div class="instruction-steps">
        <div class="step-item">
          <span class="step-num">1</span>
          <span class="step-text">點擊下方按鈕並<strong>允許相機權限</strong></span>
        </div>
        <div class="step-item">
          <span class="step-num">2</span>
          <span class="step-text">對準故事頁數 4/11 <strong>小宇接電線</strong>畫面</span>
        </div>
        <div class="step-item">
          <span class="step-num">3</span>
          <span class="step-text">驚喜動畫立即在繪本上展開！</span>
        </div>
      </div>

      <button id="btn-start-ar" class="start-btn">
        <span>🚀 開啟 AR 探索</span>
      </button>

      <div class="modal-footnote">
        💡 建議在光線充足處使用｜點擊即解鎖聲音特效
      </div>
    </div>
  </div>

  <!-- Modal 2: Target Image Card Modal (For single device / on-screen testing) -->
  <div id="modal-preview" class="modal-backdrop hidden">
    <div class="modal-card preview-card">
      <div class="preview-header">
        <h3>📷 辨識目標範例圖</h3>
        <button id="btn-close-preview" class="close-x-btn">✕</button>
      </div>
      <div class="preview-img-wrap">
        <img src="./assets/images/target_preview.jpg" alt="故事頁數 4/11 小宇接電線 目標圖" class="preview-img">
      </div>
      <p class="preview-tip">
        <strong>提示：</strong>可使用另一台手機或平板掃描上方畫面，或將鏡頭對準電腦螢幕／列印本。
      </p>
    </div>
  </div>

  <!-- Modal 3: Error / Permission Denied Modal -->
  <div id="modal-error" class="modal-backdrop hidden">
    <div class="modal-card error-card">
      <div class="error-icon">⚠️</div>
      <h2 id="error-title">無法啟動相機</h2>
      <p id="error-message">請確認瀏覽器已允許使用相機權限，並確認網址是以 HTTPS 或 localhost 連線。</p>
      <div class="error-actions">
        <button id="btn-retry" class="start-btn">🔄 重新嘗試</button>
        <button id="btn-error-back" class="nav-btn outline">返回繪本</button>
      </div>
    </div>
  </div>

  <!-- Hidden Audio Elements (Pre-loaded) -->
  <audio id="audio-electric" src="./assets/audio/electric.wav" preload="auto"></audio>
  <audio id="audio-chang" src="./assets/audio/chang.mp3" preload="auto"></audio>
  <audio id="audio-popcorn" src="./assets/audio/popcorn.mp3" preload="auto"></audio>
  <audio id="audio-chime" src="./assets/audio/chime.wav" preload="auto"></audio>

  <!-- Main Application Script -->
  <script src="./script.js"></script>
</body>
</html>
